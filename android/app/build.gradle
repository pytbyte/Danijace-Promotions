apply plugin: 'com.android.application'

android {
    namespace = "com.pytbyte.geoshua"

    compileSdk = rootProject.ext.compileSdkVersion

    /*
     * BuildConfig is required because the background SMS worker
     * uses a custom BuildConfig field for temporary authentication.
     */
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.pytbyte.geoshua"

        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        /*
         * Temporary background SMS worker authentication.
         *
         * This must match:
         *
         * SMS_WORKER_TEST_TOKEN
         *
         * on the server.
         *
         * This is only being used to prove the background
         * SMS pipeline. It will later be replaced with
         * proper registered-device authentication.
         */
        buildConfigField(
            "String",
            "GEO_SHUA_SMS_WORKER_TOKEN",
            "\"GEO_SHUA_SMS_WORKER_2026_TEST_9f7a2c81b4e6\""
        )

        aaptOptions {
            /*
             * Files and dirs to omit from the packaged assets dir,
             * modified to accommodate modern web apps.
             *
             * Default:
             * https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
             */
            ignoreAssetsPattern =
                '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildTypes {
        release {
            minifyEnabled false

            proguardFiles(
                getDefaultProguardFile(
                    'proguard-android.txt'
                ),
                'proguard-rules.pro'
            )
        }
    }
}

repositories {
    flatDir {
        dirs(
            '../capacitor-cordova-android-plugins/src/main/libs',
            'libs'
        )
    }
}

dependencies {
    implementation fileTree(
        include: ['*.jar'],
        dir: 'libs'
    )
    implementation platform("com.google.firebase:firebase-bom:34.19.0")
    
    implementation "com.google.firebase:firebase-messaging"

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"

    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"

    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    implementation "androidx.biometric:biometric:1.1.0"

    /*
     * WorkManager
     *
     * Runs the SMS outbox worker even when the
     * Capacitor/WebView UI is not running.
     */
    implementation "androidx.work:work-runtime:2.11.2"

    implementation project(':capacitor-android')

    implementation project(':capacitor-cordova-android-plugins')

    testImplementation "junit:junit:$junitVersion"

    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"

    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')

    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info(
        "google-services.json not found, google-services plugin not applied. Push Notifications won't work"
    )
}
